[workspace]
authors = ["Filipe Fernandes <ocefpaf@gmail.com>"]
channels = ["conda-forge"]
name = "dmac_2026"
platforms = ["linux-64"]
version = "1.0.0"

[tasks]
notebook = "jupyter nbclassic --ip=127.0.0.1 --NotebookApp.iopub_data_rate_limit=1000000000"

[dependencies]
nbclassic = ">=1.3.3,<2"
erddapy = ">=3.2.1,<4"
gliderpy = ">=1.1.0,<2"
cartopy = ">=0.25.0,<0.26"
netcdf4 = ">=1.7.4,<2"
xarray = ">=2026.4.0,<2027"
pandas = ">=3.0.3,<4"
matplotlib-base = ">=3.10.9,<4"
joblib = ">=1.5.3,<2"
folium = ">=0.20.0,<0.21"
gsw = ">=3.6.21,<4"
